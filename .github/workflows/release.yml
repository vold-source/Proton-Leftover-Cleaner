# Publishes a GitHub release whenever a version tag (like v1.2.0) is pushed.
# It can also be started by hand ("Run workflow" on the Actions page, or by
# Claude through GitHub) with the release notes typed in. Then the tag is
# made from APP_VERSION on the chosen branch. This exists because Claude's
# cloud sessions can push branches but not tags.
#
# What it does, step by step:
#   1. Checks that the tag matches APP_VERSION in proton-leftover-cleaner.sh,
#      so a release can never carry the wrong version number.
#   2. Builds the AppImage with packaging/appimage/build.sh.
#   3. Creates the release "Proton Leftover Cleaner X.Y.Z", uses the tag's
#      message as the release notes, attaches the three build files and
#      marks it as the latest release (AppImage updaters look there).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches APP_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^readonly APP_VERSION="\(.*\)"$/\1/p' proton-leftover-cleaner.sh)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              # Started by hand: the tag is new and named after APP_VERSION.
              if gh release view "v$version" > /dev/null 2>&1; then
                  echo "Release v$version already exists" >&2
                  exit 1
              fi
              echo "TAG=v$version" >> "$GITHUB_ENV"
          elif [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version" >&2
              exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Build the AppImage
        run: bash packaging/appimage/build.sh

      - name: Read the release notes from the tag message
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              printf '%s\n' "$NOTES" > notes.md
              cat notes.md
              exit 0
          fi
          # The checkout step may drop the tag's message, so fetch the tag again.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Proton Leftover Cleaner $VERSION" \
              --notes-file notes.md \
              --latest \
              build/Proton_Leftover_Cleaner-"$VERSION"-x86_64.AppImage \
              build/Proton_Leftover_Cleaner-"$VERSION"-x86_64.AppImage.sha256 \
              build/Proton_Leftover_Cleaner-"$VERSION"-x86_64.AppImage.zsync
